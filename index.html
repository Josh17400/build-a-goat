<title>Build a GOAT</title>
<style>
:root{--bg:#0b0c10;--bg2:#12141a;--card:#171a21;--card2:#1d2029;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --tx:#eef0f5;--tx2:#a9afbd;--tx3:#9399a8;--acc:#ff8a1f;--acc2:#ffb15e;--gold:#ffc84a;--green:#5fd68a;--red:#ff6b6b;--blue:#6aa8ff;
  --r:16px;--dockH:0px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:var(--tx);min-height:100vh;
  background:radial-gradient(1200px 600px at 50% -200px,#2a2016 0%,rgba(42,32,22,0) 60%),linear-gradient(#0f1116,#0b0c10);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(var(--dockH) + 24px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:.3em 0 .1em}

.sub{color:var(--tx2);font-size:.88rem;line-height:1.4}
.muted{color:var(--tx3)}.good{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.sh .grow{flex:1}.sh b{color:var(--tx2);letter-spacing:.02em;text-transform:none;font-size:.85rem}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.ici{margin-right:.35em}
.c-gold{color:var(--gold)}.c-orange{color:var(--acc)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-blue{color:var(--blue)}.c-muted{color:var(--tx3)}
button{font-family:inherit;font-size:1rem;font-weight:700;border:0;border-radius:12px;padding:12px 18px;min-height:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,#ff9a35,#f27a0c);color:#1a1005;box-shadow:0 6px 18px rgba(255,138,31,.25),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s}
button:active{transform:scale(.97)}
button.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
button.sm{padding:6px 12px;font-size:.95rem;min-width:44px;border-radius:10px}
button:disabled{background:#1f222b;color:#6f7686;box-shadow:none;border:1px solid var(--line);cursor:default}
button.sel{background:linear-gradient(180deg,#3a2614,#2b1d10);color:var(--acc2);border:1px solid rgba(255,138,31,.7);box-shadow:0 0 0 1px rgba(255,138,31,.25)}
.wide{width:100%}
input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--acc);height:34px}
/* segmented control */
.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-width:0;background:transparent;color:var(--tx2);box-shadow:none;border:0;padding:10px 6px;font-size:.92rem;border-radius:10px}
.seg button.on{background:linear-gradient(180deg,#2d313d,#252833);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
/* chips */
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);box-shadow:none;padding:10px 12px;border-radius:14px;font-size:.92rem}
.chip small{color:var(--tx3);font-weight:500;font-size:.76rem;line-height:1.3}
.chip.on{border-color:rgba(255,138,31,.75);background:linear-gradient(180deg,#2c1d10,#201610);color:var(--acc2)}
/* builder tabs */
.tabs{position:sticky;top:0;z-index:5;margin:6px -14px 4px;padding:8px 10px;gap:2px!important;padding-top:calc(8px + env(safe-area-inset-top));margin-top:calc(-10px - env(safe-area-inset-top));
  background:linear-gradient(rgba(11,12,16,.96),rgba(11,12,16,.88));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 0;background:transparent;color:var(--tx3);box-shadow:none;padding:8px 4px;font-size:.8rem;border-radius:999px;white-space:nowrap;min-width:0;display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.tabs button .n{display:none}}
.tabs button.on{background:var(--card2);color:var(--tx);border:1px solid var(--line2)}
.tabs button .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:.7rem;margin-right:5px;background:#262a34;color:var(--tx2)}
.tabs button.on .n{background:var(--acc);color:#1a1005}
.tabs button.done .n{background:#24382c;color:var(--green)}
/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  background:rgba(12,13,18,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.dock .in{max-width:732px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock .row{flex-wrap:nowrap}
.dock .meta{font-size:.82rem;color:var(--tx2);display:flex;gap:12px;align-items:center;justify-content:space-between}

.dock .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dock button{width:100%}

.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0;background:var(--bg2)}

.acch .v{font-weight:800;text-align:right}.acch .chev{color:var(--tx3);transition:transform .15s}
.acc.open .acch .chev{transform:rotate(90deg)}
.accb{padding:2px 12px 10px;border-top:1px solid var(--line)}
.attr{display:grid;grid-template-columns:minmax(0,1fr) 64px 30px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.9rem}
.attr:last-child{border-bottom:0}
.attr .ctl{display:flex;gap:6px}
.attr .imp{display:block;font-size:.68rem;color:var(--tx3);letter-spacing:.2px;margin-top:1px}.attr .imp.hi{color:var(--acc)}
.bar{height:8px;background:#262a34;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#f27a0c,#ffc46b)}
/* hero (player header) */
.hero{display:flex;gap:12px;align-items:center}
.hero .hn{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.hero .hm{font-size:.82rem;color:var(--tx2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ovr{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),#262a34 0);position:relative}
.ovr::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ovr div{position:relative;line-height:1}.ovr b{font-size:1.45rem;font-weight:900;display:block}.ovr span{font-size:.58rem;color:var(--tx3);letter-spacing:.1em}
.role{font-size:.72rem;font-weight:700;color:var(--gold);text-align:center;margin-top:4px;max-width:80px}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--tx2);min-height:32px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg)}
details.card{border-top:1px solid var(--line);padding-top:14px}
details.card>summary{margin:-4px 0;font-size:.95rem;color:var(--tx)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:#232733;border:1px solid var(--line);font-size:.78rem;margin:3px 3px 0 0;color:var(--tx)}
.pill.bad{color:#ff8585}.pill.gold{color:var(--gold);background:#2b2214;border-color:rgba(255,200,74,.25)}
.pip{display:inline-flex;gap:2px;margin-left:2px}
.pip i{width:6px;height:6px;border-radius:50%;background:#3a3f4c}.pip i.on{background:var(--acc)}
.bankbar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,#2b1f10,#1f1a12);border:1px solid rgba(255,200,74,.25)}
.bankbar b{color:var(--gold)}
/* events, seasons */
.ev{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.9rem;line-height:1.35}
.ev .ic{margin-top:.1em}
.season{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.season b{font-size:.98rem}
.line{font-size:.8rem;color:var(--tx2);margin-top:3px}
.stars{color:var(--gold);white-space:nowrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0 0;background:var(--bg2);color:var(--tx);border:1px solid var(--line);box-shadow:none;padding:12px;border-radius:14px}
.opt .t{font-weight:700;font-size:.95rem}.opt small{display:block;color:var(--tx3);font-weight:500;font-size:.8rem;margin-top:3px;line-height:1.35}
.risk{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-top:6px}
.risk.h{background:rgba(255,107,107,.14);color:#ff8f8f}.risk.m{background:rgba(255,200,74,.13);color:var(--gold)}.risk.l{background:rgba(95,214,138,.13);color:var(--green)}.risk.s{background:rgba(255,255,255,.07);color:var(--tx2)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;font-size:.72rem;color:var(--tx3);letter-spacing:.04em}
.stat b{display:block;font-size:1.15rem;color:var(--tx);letter-spacing:0;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.meter{height:10px;background:#262a34;border-radius:6px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#f27a0c,var(--gold));border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
th{color:var(--tx3);font-weight:700;font-size:.7rem;letter-spacing:.05em}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tier{font-size:1.9rem;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,var(--gold),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.plaque{background:radial-gradient(400px 200px at 20% 0,#3a2c12,transparent),linear-gradient(160deg,#241c0f,#14110b);border:1px solid #c9a24a;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 0 0 1px rgba(201,162,74,.2),0 18px 40px rgba(201,162,74,.15)}
.pname{font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ach div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;opacity:.5;font-size:.85rem}
.ach div.got{opacity:1;border-color:rgba(201,162,74,.35)}.ach div.new{border-color:var(--gold);box-shadow:0 0 12px rgba(255,200,74,.35)}
.ach small{display:block;color:var(--tx3);font-size:.72rem;margin-top:2px}
.looks{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.looks div{display:grid;grid-template-columns:96px 44px minmax(0,1fr) 44px;align-items:center;gap:6px;font-size:.88rem}
.looks span{color:var(--tx3)}.looks b{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.looks button{padding:0;min-width:44px}
.avwrap{display:flex;justify-content:center;margin:2px 0 8px}
.reveal{opacity:0;animation:rv .45s forwards}@keyframes rv{to{opacity:1}}
.flash{animation:fl .5s}@keyframes fl{from{box-shadow:0 0 0 2px rgba(255,138,31,.5)}to{box-shadow:0 10px 30px rgba(0,0,0,.25)}}
.big{font-size:1.6rem;font-weight:900}
.note{font-size:.8rem;color:var(--tx3);margin-top:8px}
.result{border-left:3px solid var(--green)}.result.bad{border-left-color:var(--red)}
@media (min-width:640px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}.looks{grid-template-columns:1fr 1fr}}
</style>

<div id="app"></div>
<script>
// ---------- helpers ----------
let R=Math.random;const rnd=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const pick=a=>a[Math.floor(R()*a.length)];
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const ht=h=>`${Math.floor(h/12)}'${h%12}"`;

// ---------- data ----------
const ATTRS=[['sho','Shooting'],['fin','Finishing'],['pla','Playmaking'],['def','Defense'],['reb','Rebounding'],['ath','Athleticism'],['iq','Basketball IQ']];
const POS={
  PG:{h:74,w:{sho:.20,fin:.12,pla:.26,def:.12,reb:.03,ath:.17,iq:.10}},
  SG:{h:77,w:{sho:.28,fin:.15,pla:.12,def:.12,reb:.04,ath:.19,iq:.10}},
  SF:{h:79,w:{sho:.18,fin:.17,pla:.10,def:.16,reb:.07,ath:.22,iq:.10}},
  PF:{h:81,w:{sho:.12,fin:.20,pla:.07,def:.18,reb:.15,ath:.20,iq:.08}},
  C: {h:83,w:{sho:.06,fin:.22,pla:.05,def:.21,reb:.20,ath:.18,iq:.08}}};
const SUBS={sho:[['close','Close Shot'],['mid','Mid-Range'],['three','Three-Point'],['ft','Free Throw']],fin:[['layup','Layup'],['dunk','Dunk'],['post','Post Moves']],pla:[['pass','Passing'],['handle','Ball Handle']],def:[['perD','Perimeter D'],['intD','Interior D'],['stl','Steal'],['blk','Block']],reb:[['oreb','Off. Rebound'],['dreb','Def. Rebound']],ath:[['speed','Speed'],['vert','Vertical'],['str','Strength'],['stam','Stamina']],iq:[['iq','Basketball IQ'],['cons','Consistency']]};
const SUBKEYS=Object.values(SUBS).flat().map(x=>x[0]);
// height effect per inch vs 6'6" (78in); shorter players lose more on blocks and boards than tall players gain
const HMOD={oreb:2,dreb:2,intD:1.5,blk:2.4,dunk:1.8,post:1.2,str:.6,close:.8,layup:.4,perD:-.6,handle:-1.6,pass:-.4,speed:-1.3,vert:-.4,three:-.4,stl:-.4};
const FRAMES={Lean:{speed:4,vert:3,str:-6,post:-2,oreb:-2,inj:-.02,d:'Quick & bouncy, gets pushed around'},Balanced:{inj:0,d:'No strengths, no weaknesses'},Strong:{str:6,post:3,oreb:2,speed:-3,vert:-2,inj:.03,d:'Bully ball, but heavier on the joints'}};
const TRAITS=[['work','Work Ethic','Develops faster, ages slower'],['dur','Durability','Fewer and lighter injuries'],['clutch','Clutch Gene','Wins more playoff series'],['coach','Coachability','Gets more out of college'],['star','Star Power','Hype, All-Star votes, draft buzz'],['motor','Motor','Hustles every possession: more rebounds, steals and minutes'],['lead','Leadership','Makes teammates better: more wins and playoff series'],['killer','Killer Instinct','Scorer’s mentality: more shots and points, fewer assists'],['late','Late Bloomer','Raw early, but a higher ceiling and a later peak (a gamble)'],['lock','Lockdown Mindset','Takes defense personally: steals, blocks, DPOY votes'],['touch','Shooter’s Touch','Soft hands: better 3P%, FT% and FG%']];
const MIN_A=40, BUILD_MAX=90;
// ---------- difficulty & Generational Talent Points (GTP) ----------
const DIFFS={rookie:{name:'🟢 Rookie',budget:400,mult:0,d:'400 skill points. Great careers are common. Earns no GTP and unlocks no achievements.'},
  pro:{name:'🟡 Pro',budget:350,mult:1,d:'350 skill points. A real challenge. Earns GTP.'},
  hof:{name:'🔴 Hall of Fame',budget:300,mult:1.5,d:'300 skill points. Decent is normal, greatness is rare. Earns 1.5× GTP.'}};
const diff=()=>DIFFS[S.diff]||DIFFS.pro;
Object.defineProperty(globalThis,'START_BUDGET',{configurable:true,get:()=>diff().budget+15*((S&&S.perks&&S.perks.pts)||0)});
const gtpBank=()=>{try{return Math.max(0,parseInt(localStorage.getItem('bag_gtp')||'0',10)||0);}catch{return 0;}};
const setGtp=n=>{try{localStorage.setItem('bag_gtp',String(Math.max(0,Math.round(n))));}catch{}};
// what a season / college year / career is worth (before the difficulty multiplier)
const GTP_AW={'All-Star':2,'All-NBA 1st':5,'All-NBA 2nd':4,'All-NBA 3rd':3,MVP:8,'Finals MVP':4,Champion:5,DPOY:4,ROY:3,'6MOY':1,MIP:1,'Scoring Title':2};
const GTP_TIER={'Bust':0,'Role Player':1,'Solid Starter':3,'Champion Role Player':4,'All-Star':5,'Perennial All-Star':8,'Hall of Famer':12,'Top 10 All-Time':20,'🐐 THE GOAT':35};
const capF=s=>s[0].toUpperCase()+s.slice(1);
function earnGtp(base,why){const g=Math.round(base*diff().mult);if(g>0){S.gtpRun=(S.gtpRun||0)+g;(S.gtpLog=S.gtpLog||[]).push([why,g]);}return g;}
// the shop: perks bought for the NEXT player you build (applied when the career starts)
const PERKS_GTP=[
  ['pts','➕ +15 skill points','Stack up to 4 times',15,4],
  ['trait3','🧬 Third locked trait','Lock in 3 traits instead of 2',45,1],
  ['maxed','⭐ Maxed locked traits','Your locked traits start at 5/5',25,1],
  ['dna','💎 Generational DNA','+3 hidden potential (higher ceiling)',35,1],
  ['hype','📣 Early buzz','Start high school with +15 hype',10,1],
  ['armor','🛡️ Injury insurance','His first major NBA injury gets downgraded',30,1],
  ['growth','📏 Growth genes','Height slider goes 3 inches taller',18,1],
  ['spin','🎰 Era re-spins','+2 era re-spins',5,1]];
const perkCost=()=>PERKS_GTP.reduce((s,[k,,,c])=>s+c*((S.perks&&S.perks[k])||0),0);
function buyPerk(k,d){if(S.daily)return;S.perks=S.perks||{};const p=PERKS_GTP.find(x=>x[0]===k),n=(S.perks[k]||0)+d;
  if(n<0||n>p[4])return;if(d>0&&perkCost()+p[3]>gtpBank())return;S.perks[k]=n;
  if(k==='spin')S.spins=Math.max(0,S.spins+2*d);
  if(k==='trait3'&&n===0&&S.picked.length>2)S.picked.length=2;
  if(k==='growth'&&n===0)S.height=Math.min(S.height,POS[S.pos].h+5);
  trimToBudget();render();}
function trimToBudget(){let g=0;while(spent()>START_BUDGET&&g++<2000){const k=SUBKEYS.reduce((a,b)=>S.attrs[b]>S.attrs[a]?b:a);S.attrs[k]--;}}

// ---------- UI ----------
const app=document.getElementById('app');
function act(fn,...a){fn(...a);render();}
const UI=()=>S.ui||(S.ui={tab:'setup',open:null,spend:false});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// every emoji in the game's text is swapped for a custom icon when a screen is drawn
const EMO_RE=/(?:\p{Extended_Pictographic}|[←-⇿⌀-⏿■-◿☀-➿⬀-⯿])(?:️|‍(?:\p{Extended_Pictographic}|[☀-➿]))*️?/gu;
function emo(m){if(typeof EMOJI_ICON==='undefined')return m;const v=EMOJI_ICON[m.replace(/️/g,'')]||EMOJI_ICON[m];if(!v)return'';const[nm,cls]=Array.isArray(v)?v:[v,''];return icon(nm,'ici '+(cls||''));}
function iconize(root){if(typeof EMOJI_ICON==='undefined')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),todo=[];let n;
  while((n=w.nextNode())){EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))todo.push(n);}
  for(const t of todo){const s=t.nodeValue;let out='',last=0;EMO_RE.lastIndex=0;for(const m of s.matchAll(EMO_RE)){out+=esc(s.slice(last,m.index))+emo(m[0]);last=m.index+m[0].length;}out+=esc(s.slice(last));
    const tpl=document.createElement('template');tpl.innerHTML=out;t.replaceWith(tpl.content);}
  for(const el of root.querySelectorAll('[aria-label],[title]'))for(const a of['aria-label','title']){const v=el.getAttribute(a);if(v){EMO_RE.lastIndex=0;if(EMO_RE.test(v))el.setAttribute(a,v.replace(EMO_RE,'').replace(/\s+/g,' ').trim());}}}
const pips=n=>`<span class="pip">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
const starsHTML=n=>`<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
function dock(inner){return inner?`<div class="dock"><div class="in">${inner}</div></div>`:'';}

// ---------- skills ----------
function skillRow(k,l,mode){const v=S.attrs[k],e=Math.round(es(k));let ctl;
  if(mode==='build'){const off=v>=BUILD_MAX||spent()+cost(v)>START_BUDGET;ctl=`<button class="ghost sm" aria-label="Remove a point from ${l}" onclick="adj('${k}',-1)" ${v<=MIN_A?'disabled':''}>−</button><button class="sm" aria-label="Add a point to ${l}" onclick="adj('${k}',1)" ${off?'disabled':''}>+${cost(v)>1?cost(v):''}</button><button class="ghost sm" aria-label="Add 5 points to ${l}" onclick="for(let i=0;i<5;i++)adj('${k}',1)" ${off?'disabled':''}>+5</button>`;}
  else ctl=`<button class="sm" aria-label="Add a point to ${l}" onclick="spend('${k}')" ${S.bank<cost(v)||v>=99?'disabled':''}>+${cost(v)>1?cost(v):''}</button>`;
  return`<div class="attr"><span>${l}${IMP[k]==='hi'?'<small class="imp hi">high impact</small>':IMP[k]==='lo'?'<small class="imp">low impact</small>':''}</span><div class="bar"><i style="width:${e}%"></i></div><b>${e}</b><div class="ctl">${ctl}</div></div>`;}
function impactMap(){const o0=ovr(),d=SUBKEYS.map(k=>{const v=S.attrs[k];S.attrs[k]=v+1;const x=ovr()-o0;S.attrs[k]=v;return[k,x];}).sort((a,b)=>b[1]-a[1]),m={};
  d.forEach(([k],i)=>m[k]=i<6?'hi':i>=d.length-6?'lo':'');return m;}
let IMP={};
function skillAcc(mode){const u=UI();IMP=impactMap();return ATTRS.map(([c,cl])=>{const open=u.open===c,v=Math.round(eff(c));
  return`<div class="acc ${open?'open':''}"><button class="acch" aria-label="${cl} skills" aria-expanded="${open}" onclick="UI().open=UI().open==='${c}'?null:'${c}';render()"><span>${cl}</span><div class="bar"><i style="width:${v}%"></i></div><span class="v">${v}</span><span class="chev">▶</span></button>${open?`<div class="accb">${SUBS[c].map(([k,l])=>skillRow(k,l,mode)).join('')}</div>`:''}</div>`;}).join('');}
function attrRows(mode){return skillAcc(mode);}
function adj(k,d){if(d>0&&spent()+cost(S.attrs[k])<=START_BUDGET&&S.attrs[k]<BUILD_MAX)S.attrs[k]++;if(d<0&&S.attrs[k]>MIN_A)S.attrs[k]--;render();}
function spend(k){const c=cost(S.attrs[k]);if(S.bank>=c&&S.attrs[k]<99){S.bank-=c;S.attrs[k]++;}render();}
function setF(k,v){S[k]=v;render();}
function toggleTrait(k){const i=S.picked.indexOf(k);if(i>=0)S.picked.splice(i,1);else if(S.picked.length<traitLimit())S.picked.push(k);render();}
function startCareer(){S.name=(S.name||'').trim()||'Mystery Prospect';if(S.daily){S.diff='pro';S.perks={};}const pc=perkCost();if(pc){setGtp(gtpBank()-pc);S.perksBought={...S.perks};}if(S.daily)R=mulberry(seedFrom('goat'+todayKey()));
  for(const[k]of TRAITS)S.traits[k]=S.picked.includes(k)?(S.perks.maxed?5:ri(4,5)):ri(1,5);
  S.bank=START_BUDGET-spent();S.ceiling=ovr()+7+gauss()*8+(S.traits.work-3)*2.5+(S.traits.late-3)*1.2;if(S.perks.dna)S.ceiling+=3;if(S.perks.hype)S.hype+=15;S.armor=!!S.perks.armor;S.startOvr=OV();S.stage='hs';UI().spend=false;render();scrollTo(0,0);}

// ---------- player header ----------
function hero(){const o=OV(),st=S.stage;
  return`<div class="hero">${avatar(S.look,S.age,60,1)}<div class="grow"><div class="hn">${esc(S.name)}</div><div class="hm">${S.pos} · ${ht(S.height)} · ${S.frame} · Age ${S.age}</div>
  <div class="hm">${era().name.replace(EMO_RE,'').trim()}${st!=='nba'?` · Hype ${Math.max(0,Math.round(S.hype))}`:''}${st==='hs'||st==='offers'?` · ${starsHTML(stars())}`:''}${S.rival&&st==='nba'?` · ⚔️ ${S.rival.name}${S.rival.retired?' (retired)':''}`:''}</div></div>
  <div><div class="ovr" style="--p:${o}"><div><b>${o}</b><span>OVR</span></div></div><div class="role">${st==='nba'||st==='end'?ovrLabel(o):o<55?'Not NBA-ready yet':'NBA level: '+ovrLabel(o)}</div></div></div>`;}
function traitsBlock(){const hi=TRAITS.filter(([k])=>S.traits[k]>=4).length,lo=TRAITS.filter(([k])=>S.traits[k]<=1).length;
  return`<details><summary>Traits · ${hi} strength${hi===1?'':'s'}${lo?` · ${lo} weakness${lo===1?'':'es'}`:''}</summary><div>${TRAITS.slice().sort((a,b)=>S.traits[b[0]]-S.traits[a[0]]).map(([k,l])=>`<span class="pill ${S.traits[k]<=1?'bad':''}">${l}${pips(S.traits[k])}</span>`).join('')}${S.badges.map(b=>`<span class="pill gold">🎯 ${b}</span>`).join('')}</div></details>`;}
function bankBlock(){const u=UI();if(S.bank<=0)return u.spend?`<div class="bankbar"><div class="grow"><b>All bonus points spent</b></div><button class="sm" onclick="UI().spend=false;render()">Done</button></div>`:'';
  return`<div class="bankbar"><div class="grow"><b>${S.bank} bonus point${S.bank>1?'s':''}</b><div class="sub">Carry over until the draft, then auto-assign.</div></div><button class="sm" onclick="UI().spend=!UI().spend;render()">${u.spend?'Done':'Spend'}</button></div>${u.spend?`<div style="margin-top:8px">${skillAcc('bank')}</div>`:''}`;}
function playerCard(mode){return`<div class="card">${hero()}${traitsBlock()}${mode?bankBlock():''}</div>`;}
function evList(ev){return ev.map(([g,t])=>`<div class="ev ${g>0?'good':g<0?'bad':''}">${t}</div>`).join('');}
function seasonList(arr){if(!arr.length)return'';const rev=arr.slice().reverse();
  const one=s=>`<div class="season"><b>${s.title}</b>${s.stars?starsHTML(s.stars):''}</div><div class="line">${s.line}</div>${(s.acc||[]).map(a=>`<div class="ev gold">${a}</div>`).join('')}${evList(s.ev)}`;
  return`<div class="card">${one(rev[0])}</div>${rev.length>1?`<details class="card"><summary>Earlier seasons · ${rev.length-1}</summary>${rev.slice(1).map(s=>`<div style="margin-top:14px">${one(s)}</div>`).join('')}</details>`:''}`;}

// ---------- decisions ----------
const RISK=[[/High risk/,'h','High risk'],[/Medium risk/,'m','Medium risk'],[/Low risk/,'l','Low risk'],[/Safe/,'s','Safe']];
function optBtn(o,on){const r=RISK.find(x=>x[0].test(o.desc)),d=o.desc.replace(/\s·\s\S*\s?(High risk|Medium risk|Low risk|Safe)\s*$/,'');
  return`<button class="opt" onclick="${on}"><div class="grow"><div class="t">${o.label}</div><small>${d}</small>${r?`<span class="risk ${r[1]}">${r[2]}</span>`:''}</div></button>`;}
function summerCard(){const p=S.summerPend;return`<div class="card flash"><div class="sh">☀️ <span class="grow">Summer decision</span></div><h2>${p.title.replace(/^☀️\s*/,'')}</h2><div class="sub">${p.text}</div>${p.opts.map((o,i)=>optBtn(o,`act(chooseSummer,${i})`)).join('')}</div>`;}
function decisionCard(){const p=S.pend;return`<div class="card flash"><div class="sh">${p.kind==='summer'?'☀️':p.kind==='fa'?'✍️':p.kind==='retire'?'🕰️':'⚡'} <span class="grow">${p.kind==='summer'?'Summer decision':p.kind==='fa'?'Free agency':p.kind==='retire'?'Retirement':'Career moment'}</span></div>${/summer decision/i.test(p.title)?'':`<h2>${p.title.replace(EMO_RE,'').trim()}</h2>`}<div class="sub">${p.text}</div>${p.opts.map((o,i)=>optBtn(o,`act(choose,${i})`)).join('')}</div>`;}
function resultCard(){const r=S.lastResult;return r?`<div class="card result ${r.ok?'':'bad'}"><div class="ev ${r.ok?'good':'bad'}">${r.ok?'✅':'❌'} <b>${r.ok?'It paid off':'It backfired'}</b></div><div class="sub">${r.text.replace(/^☀️\s*/,'')}</div></div>`:'';}

// ---------- NBA cards ----------
function legacyCard(){const c=career(),sc=goatScore(c),[t]=tierOf(sc,c),g=x=>c.cnt[x]||0,last=S.nba[S.nba.length-1];
  const steps=[[60,'Perennial All-Star'],[120,'Hall of Famer'],[200,'Top 10 All-Time'],[350,'GOAT']],nx=steps.find(s=>sc<s[0]),pace=last?c.pts+last.ppg*70*Math.max(0,34-S.age)*.8:0;
  const label=S.nba.length<4?'Early career':t==='Bust'||t==='Role Player'?(last&&last.mins>=28?'Starter on the rise':'Fighting for minutes'):t.replace(EMO_RE,'').trim();
  return`<div class="card"><div class="sh">📈 <span class="grow">Legacy</span><b class="gold">${label}</b></div>
  <div class="row" style="align-items:baseline;gap:6px"><span class="big">${sc}</span><span class="muted">/ 350 GOAT score</span></div><div class="meter"><i style="width:${Math.min(100,sc/350*100)}%"></i></div>
  <div class="sub">${nx?`Next tier: <b>${nx[1]}</b> at ${nx[0]} score`:'GOAT territory'}${last&&S.age<34?` · on pace for ~${(Math.round(pace/1000)*1000).toLocaleString()} pts`:''}</div>
  <div class="stat4" style="margin-top:10px"><div class="stat"><b>${Math.round(c.pts).toLocaleString()}</b>PTS</div><div class="stat"><b>${g('Champion')}</b>RINGS</div><div class="stat"><b>${g('All-Star')}</b>ALL-STAR</div><div class="stat"><b>${Math.round(S.gtpRun||0)}</b>GTP</div></div>
  <details><summary>Legend benchmarks · ${benchList(c).filter(x=>x[1]).length}/${benchList(c).length}</summary>${benchList(c).map(([l,ok])=>`<div class="ev ${ok?'good':'muted'}">${ok?'✅':'⬜'} ${l}</div>`).join('')}</details></div>`;}
function seasonCard(s){const aw=s.aw.filter(x=>x!=='MVP'),role=s.mins>=28?['good','Starter']:s.mins>=18?['muted','Bench rotation']:['muted','Deep bench'];
  return`<div class="card flash"><div class="sh">🏀 <span class="grow">Season ${s.yr} · Age ${s.age}</span><b class="${role[0]}">${role[1]}</b></div><div style="font-weight:700">${s.team} · ${s.wins}-${82-s.wins}</div>
  <div class="stat4" style="margin:10px 0 4px"><div class="stat"><b>${f1(s.ppg)}</b>PPG</div><div class="stat"><b>${f1(s.rpg)}</b>RPG</div><div class="stat"><b>${f1(s.apg)}</b>APG</div><div class="stat"><b>${s.gp}</b>GAMES</div></div>
  ${s.scRank&&s.scRank<=15?`<div class="ev">📊 ${ord(s.scRank)} in the league in scoring</div>`:''}
  ${s.mvpRank&&s.mvpRank<=8?`<div class="ev ${s.mvpRank===1?'gold':''}">👑 ${s.mvpRank===1?'Wins MVP!':`Finished ${ord(s.mvpRank)} in MVP voting`}</div>`:''}
  ${aw.length?`<div class="ev gold">🏅 ${aw.join(' · ')}</div>`:''}${s.inj?`<div class="ev bad">${/🚑|🛡/.test(s.inj)?'':'🤕 '}${s.inj}</div>`:''}${s.gp<65?`<div class="ev muted">⚠️ ${s.gp} games: not eligible for MVP, All-NBA or other awards (65-game rule)</div>`:''}
  ${s.path.length?s.path.map(x=>`<div class="ev ${x.includes(': beat')?'good':'bad'}">${x.includes(': beat')?'✅':'❌'} ${x}</div>`).join(''):'<div class="ev muted">🚫 Missed the playoffs</div>'}
  ${s.po.includes('CHAMPION')?'<div class="ev gold">🏆 <b>NBA Champions</b></div>':''}
  ${s.gtp?`<div class="ev gold">💎 +${s.gtp} GTP</div>`:''}${s.notes.map(x=>`<div class="ev">${x}</div>`).join('')}${s.ovr<61&&S.stage==='nba'?'<div class="ev bad">⚠️ On the roster bubble. Players below 61 OVR can get cut.</div>':''}
  ${s.rv?`<div class="note">⚔️ Rival ${s.rv.name}: ${f1(s.rv.ppg)} PPG, ${s.rv.wins} wins</div>`:''}</div>`;}
function seasonTable(rev){if(!S.nba.length)return'';const rows=S.nba.map(s=>`<tr><td>${s.yr}</td><td>${s.team.split(' ').slice(-1)}</td><td>${s.age}</td><td>${s.ovr}</td><td>${s.gp}</td><td>${f1(s.mins)}</td><td><b>${f1(s.ppg)}</b></td><td>${f1(s.rpg)}</td><td>${f1(s.apg)}</td><td>${f1(s.spg)}</td><td>${f1(s.bpg)}</td><td>${(s.fg*100).toFixed(1)}</td><td>${(s.tp*100).toFixed(1)}</td><td>${(s.ft*100).toFixed(1)}</td><td>${s.wins}-${82-s.wins}</td></tr>
  <tr><td></td><td colspan="14" style="text-align:left;white-space:normal" class="sub">${s.po}${s.aw.length?' · <span class="gold">'+s.aw.join(' · ')+'</span>':''}${s.inj?' · <span class="bad">'+s.inj+'</span>':''}</td></tr>`);
  return`<div class="scroll" style="margin-top:10px"><table><tr><th>YR</th><th>TEAM</th><th>AGE</th><th>OVR</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG%</th><th>3P%</th><th>FT%</th><th>W-L</th></tr>${(rev?rows.reverse():rows).join('')}</table></div>`;}

// ---------- builder pieces ----------
function gtpCard(){const bank=gtpBank(),cost=perkCost();
  if(S.daily)return`<div class="card"><div class="sh">💎 <span class="grow">Generational Talent Points</span><b>${bank}</b></div><div class="sub">Perks are off for the Daily Build so everyone plays on equal terms. You still earn GTP.</div></div>`;
  if(!bank&&!cost)return`<div class="card"><div class="sh">💎 <span class="grow">Generational Talent Points</span><b>0</b></div><div class="sub">Earn GTP on Pro or Hall of Fame from great seasons, then spend it here on perks for your next player.</div></div>`;
  const canBuy=PERKS_GTP.some(([k,l,d,c,mx])=>c<=bank-cost&&((S.perks&&S.perks[k])||0)<mx);
  return`<details class="card" ${cost||canBuy?'open':''}><summary role="button">💎 GTP Shop · <span class="gold">${bank-cost} available</span>${cost?` · ${cost} in cart`:canBuy?' · tap a perk to buy':''}</summary>
  ${PERKS_GTP.map(([k,l,d,c,mx])=>{const n=(S.perks&&S.perks[k])||0;return`<div class="row" style="margin-top:12px;flex-wrap:nowrap"><div class="grow"><b>${l}</b>${n?` <span class="gold">×${n}</span>`:''}<div class="sub">${d} · ${c} GTP</div></div>
    <button class="ghost sm" aria-label="Remove ${l}" onclick="buyPerk('${k}',-1)" ${n?'':'disabled'}>−</button><button class="sm" aria-label="Buy ${l}" onclick="buyPerk('${k}',1)" ${n>=mx||bank-cost<c?'disabled':''}>+</button></div>`;}).join('')}</details>`;}
function diffCard(){return`<div class="card"><div class="sh">🎚️ <span class="grow">Difficulty</span></div><div class="seg">${Object.entries(DIFFS).map(([k,v])=>`<button class="${S.diff===k?'on':''}" onclick="setDiff('${k}')" ${S.daily&&k!=='pro'?'disabled':''}>${v.name.replace(/^\S+\s/,'')}</button>`).join('')}</div><div class="note">${diff().d}${S.daily?' The Daily Build is always played on Pro.':''}</div></div>`;}
function lookEditor(){return`<div class="card"><div class="avwrap">${avatar(S.look,18,150,1)}</div><div class="row" style="margin-bottom:8px"><span class="sh grow" style="margin:0">Customize</span><button class="sm ghost" onclick="S.look=randLook();render()">🎲 Random look</button></div>
  <div class="looks">${LOOKS.map(([k,l,o])=>`<div><span>${l}</span><button class="ghost sm" aria-label="Previous ${l}" onclick="cyc('${k}',-1)">◀</button><b>${o()[(S.look[k]||0)%o().length].replace(EMO_RE,'').trim()}</b><button class="ghost sm" aria-label="Next ${l}" onclick="cyc('${k}',1)">▶</button></div>`).join('')}
  <div><span>Number</span><button class="ghost sm" aria-label="Lower number" onclick="S.look.num=(S.look.num+99)%100;render()">◀</button><b>#${S.look.num}</b><button class="ghost sm" aria-label="Higher number" onclick="S.look.num=(S.look.num+1)%100;render()">▶</button></div></div></div>`;}
function heightText(){return`${S.height>POS[S.pos].h?'Tall for a '+S.pos+' (a little more injury risk)':S.height<POS[S.pos].h?'Undersized for a '+S.pos:'Standard size for a '+S.pos}`;}
function dunkCap(){return S.height<=76&&es('dunk')<S.attrs.dunk?`<div class="ev gold">⚠️ Dunk is capped at ${Math.round(es('dunk'))} by his size. Add Vertical to raise it.</div>`:'';}
function updHeight(){const a=document.getElementById('hval'),b=document.getElementById('hnote'),c=document.getElementById('heff');if(a)a.textContent=ht(S.height);if(b)b.textContent=heightText();if(c)c.innerHTML=heightNote();}
const TABS=[['setup','Setup'],['look','Look'],['body','Body'],['skills','Skills'],['traits','Traits']];
function goTab(k){UI().tab=k;render();scrollTo(0,0);}
function buildHTML(){const u=UI(),left=START_BUDGET-spent(),ti=Math.max(0,TABS.findIndex(t=>t[0]===u.tab)),tab=TABS[ti][0];let h=`<div class="tabs">${TABS.map(([k,l],i)=>`<button class="${tab===k?'on':''} ${i<ti?'done':''}" onclick="goTab('${k}')"><span class="n">${i+1}</span>${l}</button>`).join('')}</div>`;
  if(tab==='setup')h+=`<h1>Build a <span>GOAT</span></h1><div class="sub">Build a raw prospect, survive high school and college, and find out if he becomes the greatest of all time.</div>${diffCard()}
    <div class="card"><div class="sh">🎰 <span class="grow">League era</span>${S.daily?'<b>Daily</b>':`<button class="ghost sm" onclick="spinEra()" ${S.spins<=0?'disabled':''}>🎲 Re-spin · ${S.spins}</button>`}</div><div style="font-size:1.15rem;font-weight:800">${era().name}</div><div class="sub">${era().d}</div>
    <details><summary>📅 Daily Build${S.daily?' · on':''}</summary><div class="sub">Same era and same dice for everyone today. Played on Pro with no perks.</div><button class="${S.daily?'sel':'ghost'} wide" style="margin-top:8px" onclick="toggleDaily()">${S.daily?'Daily Build is on · tap to turn off':'Play today\'s Daily Build'}</button>${S.daily&&dailyBest().length?`<div class="note">Today's best: ${dailyBest().slice(0,3).map(x=>`<b>${esc(x.name)}</b> ${x.score}`).join(' · ')}</div>`:''}</details></div>
    ${gtpCard()}<div class="card"><div class="sh">⚡ <span class="grow">Quick start</span></div><div class="chips">${ARCH.map((a,i)=>`<button class="chip ${S.arch===a[0]?'on':''}" onclick="applyArch(${i})">${a[0]}<small>${a[1]} · ${ht(a[2])}</small></button>`).join('')}<button class="chip" onclick="randomBuild()">🎲 Randomize<small>Body, skills and traits</small></button></div><div class="note">Presets fill in your body and skills. You can still change everything.</div></div>${hofHTML()}${achHTML()}`;
  if(tab==='look')h+=`<h1>Look</h1><div class="card"><div class="sh">✍️ <span class="grow">Name</span></div><input id="nm" type="text" maxlength="24" value="${esc(S.name)}" placeholder="Name your prospect" oninput="S.name=this.value"></div>${lookEditor()}`;
  if(tab==='body')h+=`<h1>Body</h1><div class="card"><div class="sh">🏀 <span class="grow">Position</span></div><div class="seg">${Object.keys(POS).map(p=>`<button class="${S.pos===p?'on':''}" onclick="(S.hPos=S.hPos||{})[S.pos]=S.height;S.pos='${p}';S.height=S.hPos['${p}']??POS['${p}'].h;render()">${p}</button>`).join('')}</div></div>
    <div class="card"><div class="sh">📏 <span class="grow">Height</span><b id="hval">${ht(S.height)}</b></div><input type="range" aria-label="Height" min="${POS[S.pos].h-4}" max="${POS[S.pos].h+5+(S.perks&&S.perks.growth?3:0)}" value="${S.height}" oninput="S.height=+this.value;updHeight()" onchange="render()"><div class="sub" id="hnote">${heightText()}</div><div class="note" id="heff">${heightNote()}</div>${dunkCap()}</div>
    <div class="card"><div class="sh">💪 <span class="grow">Frame</span></div><div class="seg">${Object.keys(FRAMES).map(f=>`<button class="${S.frame===f?'on':''}" onclick="setF('frame','${f}')">${f}</button>`).join('')}</div><div class="note">${FRAMES[S.frame].d}</div></div>`;
  if(tab==='skills')h+=`<h1>Skills</h1><div class="sub">Tap a group to open it. Skills cost 1 point each up to 70, then 2, then 3 above 85 (the + button shows the price). Max 90 here; grow higher during the career. Numbers shown include your height bonus. OVR weighs every skill for your position and era.</div>${skillAcc('build')}`;
  if(tab==='traits')h+=`<h1>Traits</h1><div class="sub">Lock in ${traitLimit()}. The other ${TRAITS.length-traitLimit()} are rolled at random.</div><div class="card"><div class="chips">${TRAITS.map(([k,l,d])=>`<button class="chip ${S.picked.includes(k)?'on':''}" onclick="toggleTrait('${k}')">${l}<small>${d}</small></button>`).join('')}</div></div>`;
  const ready=S.picked.length>=traitLimit(),nxt=TABS[ti+1];
  return h+dock(`<div class="meta"><span><b>${left}</b> pts left${left>0&&ready?' <small class="muted">(saved as bonus pts)</small>':''}</span><span>OVR <b>${OV()}</b></span><span>Traits <b>${S.picked.length}/${traitLimit()}</b></span></div>
    <div class="two">${nxt?`<button class="ghost" onclick="goTab('${nxt[0]}')">Next: ${nxt[1]} ▶</button>`:`<button class="ghost" onclick="goTab('setup')">◀ Back to Setup</button>`}<button onclick="${ready?'startCareer()':"goTab('traits')"}" class="${ready?'':'ghost'}">${ready?'Start High School':`Pick ${traitLimit()-S.picked.length} trait${traitLimit()-S.picked.length===1?'':'s'}`}</button></div>`);}

// ---------- screens ----------
function render(){const st=S.stage;let h='';
  if(st==='build')h=buildHTML();
  else if(st==='hs'){const i=S.hs.length;h=`<h1>High School</h1>${playerCard(true)}${S.summerPend?summerCard():resultCard()}${seasonList(S.hs)}`+(S.summerPend?'':dock(`<button onclick="act(simHS)">Play ${YR[i]} Year</button>`));}
  else if(st==='offers'){const n=stars();h=`<h1>Recruiting</h1>${playerCard(true)}<div class="card"><div class="sh">🎓 <span class="grow">Scholarship offers</span><b>${S.offers.length}</b></div><div class="row" style="align-items:baseline"><h2 style="margin:0">${n}-star recruit</h2>${starsHTML(n)}</div>
    <div class="sub">${n>=5?'Every program in the country wants him. Take your pick.':n===4?'Plenty of big-time options.':n===3?'A few solid options.':'Slim pickings. Make the most of it.'}</div>
    ${S.offers.map((o,i)=>`<button class="opt" onclick="chooseSchool(${i})"><div class="grow"><div class="t">${o.name}</div><small>${TIER[o.tier].lbl} · ${TIER[o.tier].d}</small><span class="risk l" style="text-transform:none;letter-spacing:0;font-size:.74rem">${o.perk[0]}: ${o.perk[1]}</span></div></button>`).join('')}
    <div class="note">Stars come from skill (OVR) plus hype from big games, camps, mixtapes and Star Power.</div></div>${seasonList(S.hs)}`;}
  else if(st==='college'){const y=S.col.length;let dk='';h=`<h1>${S.school}</h1>${playerCard(true)}`;
    if(S.summerPend)h+=summerCard();
    else if(!y)dk=`<button onclick="act(simCol)">Play Freshman Season</button>`;
    else{const[a,b]=projRange(),ab={18:'+9',19:'+7',20:'+4',21:'+1',22:'−2',23:'−5'}[draftAge()]??'−7';
      h+=`<div class="card flash"><div class="sh">📋 <span class="grow">Draft decision</span><b>Age ${draftAge()} on draft night</b></div><div style="font-size:1.25rem;font-weight:800">${pickTxt(a)} – ${pickTxt(b)}</div><div class="sub">Projected range if he declares now</div>
      ${a>30?`<div class="ev bad">⚠️ Outside the first round${b>=61?', and he could go undrafted':''}. ${S.mustDeclare?'He is out of eligibility, so the combine is his last shot.':'Another year could help.'}</div>`:''}
      <details><summary>How draft stock works</summary><div class="sub">Scouts love youth: ${ab.startsWith('+')?`he gets a ${ab} youth bonus`:`he takes a ${ab.slice(1)} age penalty`} at age ${draftAge()}. Each year he stays he improves, but scouts knock him for age, so stock can drop even after a great year. The combine can still move him a few spots.</div></details></div>`;
      dk=`<div class="two"><button onclick="declare()">Declare for the Draft</button>${S.mustDeclare?'<button class="ghost" disabled>Out of eligibility</button>':`<button class="ghost" onclick="returnSchool()">Return for ${YR[y]} Year</button>`}</div>`;}
    h+=resultCard()+seasonList(S.col)+dock(dk);}
  else if(st==='draft'){const p=S.pick,cb=S.combine,d0=S.board.length*.3;
    h=`<h1>Draft Night</h1><div class="card"><div class="sh">📏 <span class="grow">Combine</span></div><div class="stat4">${[['VERT',cb.vert+'"'],['SPRINT',cb.sprint+'s'],['BENCH',cb.bench],['WING',ht(cb.wing)]].map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join('')}</div>
    <div class="note">${cb.adj>=1?'📈 Scouts are buzzing. His stock is rising.':cb.adj<=-1?'📉 Underwhelming testing. His stock slips.':'➖ Solid testing. No big moves.'}${S.projD?(p<S.projD[0]?' Teams liked him more than projected.':p>S.projD[1]?' But teams still passed on him longer than projected.':''):''}</div></div>
    <div class="card"><div class="sh">🎙️ <span class="grow">On the clock</span></div>${S.board.map((b,i)=>`<div class="ev reveal" style="animation-delay:${i*.3}s"><span class="muted">#${b.n}</span> <b>${b.name}</b> <span class="muted">${b.pos} · ${b.school}</span></div>`).join('')}</div>
    <div class="card reveal" style="text-align:center;animation-delay:${d0+.3}s"><div class="avwrap">${avatar(S.look,S.age,96,1)}</div><div class="sub">${p>=61?'60 names called. His isn\'t one of them.':`With the #${p} pick in the NBA Draft, the`}</div>
    <div class="big" style="margin:6px 0">${p>=61?'Undrafted':S.team}</div><div class="sub">${p>=61?`He signs a two-way deal with the ${S.team}. Time to prove everyone wrong.`:`select <b>${esc(S.name)}</b> out of ${S.school}`}</div>
    <div style="margin-top:10px"><span class="pill">Scout grade ${grade(S.scoutAtDraft)}</span> <span class="pill">True ceiling ???</span> <span class="pill">Age ${S.age}</span></div></div>
    <div class="card reveal" style="animation-delay:${d0+.7}s"><div class="ev">⚔️ <span>Also in this class: <b>${S.rival.name}</b>, taken by the ${S.rival.team}. The media is already calling him your rival.</span></div></div>`+dock(`<button onclick="S.stage='nba';render();scrollTo(0,0)">Start NBA Career</button>`);}
  else if(st==='nba'){let dk='';h=`<h1>NBA Career</h1>${playerCard(false)}${legacyCard()}${resultCard()}`;
    if(S.pend)h+=decisionCard();else dk=`<button onclick="act(simNBA)">Sim Season ${S.nba.length+1}</button><div class="two"><button class="ghost" onclick="simAll()">Next Decision ⏩</button><button class="ghost" onclick="simEnd()">Whole Career ⏭</button></div>`;
    if(S.nba.length)h+=seasonCard(S.nba[S.nba.length-1]);
    if(S.nba.length>1)h+=`<details class="card"><summary>📊 Season log · ${S.nba.length} seasons</summary>${seasonTable(true)}</details>`;
    h+=dock(dk);}
  else if(st==='end')h=endHTML();
  app.innerHTML=h;iconize(app);const d=app.querySelector('.dock');document.documentElement.style.setProperty('--dockH',(d?d.offsetHeight:0)+'px');}
function simEnd(){let g=0;while(S.stage==='nba'&&g++<120){if(S.pend)choose(S.pend.kind==='summer'?S.pend.opts.length-2:0);else simNBA();}render();scrollTo(0,0);}
function simAll(){let g=0;while(S.stage==='nba'&&!S.pend&&g++<25)simNBA();render();}
function endHTML(){const c=career(),sc=goatScore(c),[t,d]=tierOf(sc,c),k=c.cnt,g=x=>k[x]||0,gp=c.gp||1;
  const p=S.pick,sg=grade(S.scoutAtDraft),tc=grade(Math.max(S.ceiling,c.peak));let story;
  const lowT=['Bust','Role Player'].includes(t);if(p<=10&&c.peak<72&&lowT)story='One of the biggest busts of his draft class.';else if(p<=10&&lowT)story='Never lived up to his lottery billing.';else if(p>=31&&c.peak>=84)story='The steal of the draft. 29+ teams passed on a superstar.';
  else if(p>=15&&c.peak>=86)story='Teams slept on him. They regret it.';else if(p<=3&&c.peak>=88)story='Lived up to every ounce of the hype.';else{const v=a=>a[(S.nba.length+S.pick+(S.name||'').length)%a.length],gs=g('Champion');
    if(t==='Bust')story=v(['It just never came together.','The league figured him out fast.','Some guys just aren’t built for the league.']);
    else if(S.nba.length<=6)story=v(['A short window, but he made it to the league.','In and out of the league before he could settle in.','His body and his luck never gave him a real run.']);
    else if(gs>=3&&!['GOAT','Top 10 All-Time'].some(x=>t.includes(x)))story=v(['A winner first. The rings speak for themselves.','Wherever he went, banners followed.']);
    else if(c.peak>=S.ceiling-1)story=['THE GOAT','Top 10 All-Time','Hall of Famer'].some(x=>t.includes(x))?v(['Squeezed every drop out of his talent.','Maxed out every gift he had, and then some.','Reached his ceiling and lived there for a decade.']):v(['Made the most of what he had.','Got everything out of his game. No regrets.','A pro’s pro who maxed out his tools.']);
    else story=v(['Left some potential on the table.','There was more in the tank. Injuries and bad luck took it.','Good career. You wonder what could have been.']);}
  const acc=[['Champion','🏆 Champion'],['MVP','👑 MVP'],['Finals MVP','🏅 Finals MVP'],['All-NBA 1st','🥇 All-NBA 1st'],['All-NBA 2nd','🥈 All-NBA 2nd'],['All-NBA 3rd','🎖️ All-NBA 3rd'],['All-Star','⭐ All-Star'],['DPOY','🛡️ DPOY'],['Scoring Title','🔥 Scoring title'],['ROY','🌟 Rookie of the Year'],['6MOY','🪑 6th Man'],['MIP','📈 Most Improved']].filter(([x])=>g(x));
  const bm=benchList(c),rv=S.rival,meR=g('Champion')*3+g('MVP')*4+c.pts/5000,rvR=rv?rv.rings*3+rv.mvps*4+rv.pts/5000:0;
  return`<h1>${esc(S.name)}</h1><div class="sub">${S.retired} at age ${S.age} after ${c.seasons} season${c.seasons===1?'':'s'}.</div>${plaqueHTML(c,sc,t)}
  <div class="sub" style="text-align:center">${d}</div><div class="note" style="text-align:center">📸 Screenshot the plaque and send it</div>
  <div class="card"><div class="sh">📜 <span class="grow">The story</span></div><div class="gold" style="font-weight:700">${story}</div><div style="margin-top:6px"><span class="pill">Scout grade ${sg}</span><span class="pill">True ceiling <b class="gold">${tc}</b></span><span class="pill">Peak ${grade(c.peak)}</span></div><div class="note">${pickTxt(p)} out of ${S.school} at age ${S.age-c.seasons+1}</div></div>
  ${acc.length?`<div class="card"><div class="sh">🏆 <span class="grow">Accolades</span></div>${acc.map(([x,l])=>`<span class="pill gold">${l} ×${g(x)}</span>`).join('')}</div>`:''}
  ${rv?`<div class="card"><div class="sh">⚔️ <span class="grow">Rivalry</span><b class="${meR>=rvR?'good':'bad'}">${meR>=rvR?'Won':'Lost'}</b></div><table><tr><th></th><th>${esc(S.name)}</th><th>${rv.name}</th></tr><tr><td>Rings</td><td>${g('Champion')}</td><td>${rv.rings}</td></tr><tr><td>MVPs</td><td>${g('MVP')}</td><td>${rv.mvps}</td></tr><tr><td>Points</td><td>${Math.round(c.pts).toLocaleString()}</td><td>${Math.round(rv.pts).toLocaleString()}</td></tr></table><div class="note">${meR>=rvR?'You won the rivalry.':'History remembers '+rv.name+' first.'}</div></div>`:''}
  <div class="card"><div class="sh">💎 <span class="grow">Generational Talent Points</span><b class="gold">${diff().mult?'+'+(S.gtpRun||0):'—'}</b></div>${diff().mult?`<div class="sub">Earned on ${diff().name.replace(/^\S+\s/,'')} (${diff().mult}×). Your bank: <b>${gtpBank()}</b></div><details><summary>Breakdown</summary><div class="sub">${(S.gtpLog||[]).map(([w,g])=>w+' +'+g).join(' · ')}</div></details>`:'<div class="sub">Rookie earns no GTP and unlocks no achievements. Try Pro or Hall of Fame.</div>'}</div>
  <details class="card"><summary>📊 More career numbers</summary><div class="stat3" style="margin-top:10px">${[['SPG',f1(c.stl/gp)],['BPG',f1(c.blk/gp)],['GAMES',c.gp],['TOTAL REB',Math.round(c.reb).toLocaleString()],['TOTAL AST',Math.round(c.ast).toLocaleString()],['PEAK OVR',c.peak]].map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join('')}</div></details>
  <details class="card"><summary>🌟 Legend benchmarks · ${bm.filter(x=>x[1]).length}/${bm.length}</summary>${bm.map(([l,ok])=>`<div class="ev ${ok?'good':'muted'}">${ok?'✅':'⬜'} ${l}</div>`).join('')}</details>
  ${(S.log||[]).length?`<details class="card"><summary>📝 Career decisions · ${S.log.length}</summary>${S.log.map(x=>`<div class="ev">${x}</div>`).join('')}</details>`:''}
  <details class="card"><summary>🏀 Season log · ${c.seasons}</summary>${seasonTable(false)}</details>${achHTML(S.newAch)}${hofHTML()}`+dock(`<button onclick="R=Math.random;S=newPlayer();render();scrollTo(0,0)">Build Another</button>`);}
function hofHTML(){const h=JSON.parse(localStorage.getItem('bag_hof')||'[]');if(!h.length)return'';
  return`<details class="card"><summary>🏛️ Your Hall of Builds · ${h.length}</summary><div class="scroll" style="margin-top:8px"><table><tr><th>#</th><th>PLAYER</th><th>TIER</th><th>SCORE</th><th>PPG</th><th>RINGS</th><th>MVP</th><th>PICK</th></tr>
  ${h.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)} <span class="muted">${x.pos}</span></td><td>${x.diff?DIFFS[x.diff].name.split(' ')[0]+' ':''}${x.tier}</td><td>${x.score}</td><td>${f1(x.ppg)}</td><td>${x.rings}</td><td>${x.mvp}</td><td>${x.pick>=61?'UDFA':'#'+x.pick}</td></tr>`).join('')}</table></div></details>`;}
function achHTML(fresh){const have=JSON.parse(localStorage.getItem('bag_ach')||'{}'),n=Object.keys(have).length;fresh=fresh||[];
  return`<details class="card" ${fresh.length?'open':''}><summary>🏅 Achievements · ${n}/${ACH.length}${fresh.length?` · <span class="gold">${fresh.length} new</span>`:''}</summary>${S.diff==='rookie'&&S.stage==='end'?'<div class="note">🔒 Achievements don’t unlock on Rookie.</div>':''}
  <div class="ach">${ACH.map(([id,l,d])=>`<div class="${have[id]?'got':''} ${fresh.includes(id)?'new':''}"><b>${have[id]?l:'🔒 '+l.replace(EMO_RE,'').trim()}</b><small>${d}${fresh.includes(id)?' · New':''}</small></div>`).join('')}</div></details>`;}


S=newPlayer();render();
// Bulk career sim for balance data (used by Witness; never called in normal play)
function autosim(n,build,college,faMode){const save=S,rend=render,keep=['bag_ach','bag_daily','bag_recent','bag_gtp','bag_diff'].map(k=>[k,localStorage.getItem(k)]);render=()=>{};const tiers={},rows=[];
  const BUILDS={shooter:{sho:.5,fin:.1,pla:.15,def:.05,reb:0,ath:.1,iq:.1},big:{sho:0,fin:.3,pla:0,def:.3,reb:.3,ath:.1,iq:0},athlete:{sho:.1,fin:.2,pla:.1,def:.15,reb:.05,ath:.4,iq:0}};
  for(let i=0;i<n;i++){S=newPlayer();S.pos=build==='big'?pick(['PF','C']):build==='shooter'?pick(['PG','SG']):pick(Object.keys(POS));S.height=POS[S.pos].h+ri(-1,3);S.frame=pick(Object.keys(FRAMES));
    const w=BUILDS[build]||(build==='random'?null:POS[S.pos].w);
    const pk=()=>{if(!w)return pick(SUBKEYS);let r=R(),a=0;for(const[k]of ATTRS){a+=w[k];if(r<=a)return pick(SUBS[k])[0];}return'iq';};
    let g=0;while(g++<5000){const k=pk();if(S.attrs[k]>=BUILD_MAX)continue;if(spent()+cost(S.attrs[k])>START_BUDGET)break;S.attrs[k]++;}
    const T=TRAITS.map(t=>t[0]);S.picked=[T.splice(ri(0,T.length-1),1)[0],T.splice(ri(0,T.length-1),1)[0]];startCareer();
    const sp=()=>{let g=0;while(S.bank>0&&g++<300){const k=pk();if(S.bank>=cost(S.attrs[k])&&S.attrs[k]<99)spend(k);else if(S.bank<2)break;}};
    sp();for(let y=0;y<4;y++){simHS();sp();}chooseSchool(0);simCol();sp();
    while(!S.mustDeclare&&(college==='senior'||(college==='smart'&&projRange()[0]>12))&&college!=='oad'){simCol();sp();}
    declare();S.stage='nba';g=0;while(S.stage==='nba'&&g++<80){if(S.pend){const p=S.pend;choose(p.kind==='fa'&&faMode!=='random'?{loyal:0,ring:1,bag:2}[faMode]:ri(0,p.opts.length-1));}else simNBA();}
    const c=career(),sc=goatScore(c),t=tierOf(sc,c)[0];tiers[t]=(tiers[t]||0)+1;
    rows.push({pick:S.pick,peak:c.peak,ppg:c.gp?c.pts/c.gp:0,as:c.cnt['All-Star']||0,rings:c.cnt['Champion']||0,mvp:c.cnt['MVP']||0,seasons:c.seasons,inj:S.nba.filter(s=>s.inj&&s.inj.includes('🚑')).length,sc,starPick:S.pick<=10});}
  S=save;render=rend;localStorage.removeItem('bag_hof');for(const[k,v]of keep)v==null?localStorage.removeItem(k):localStorage.setItem(k,v);
  const av=k=>+(rows.reduce((s,r)=>s+r[k],0)/n).toFixed(2),pct=f=>+(rows.filter(f).length/n*100).toFixed(1);
  const lot=rows.filter(r=>r.pick<=10),late=rows.filter(r=>r.pick>30);
  const res={n,build,college,fa:faMode,tiersPct:Object.fromEntries(Object.entries(tiers).map(([k,v])=>[k,+(v/n*100).toFixed(1)])),
    avgPick:av('pick'),undraftedPct:pct(r=>r.pick>=61),avgPeakOvr:av('peak'),avgCareerPPG:av('ppg'),avgAllStar:av('as'),avgRings:av('rings'),mvpPct:pct(r=>r.mvp>0),avgSeasons:av('seasons'),majorInjuryPct:pct(r=>r.inj>0),
    lotteryBustPct:lot.length?+(lot.filter(r=>r.sc<20).length/lot.length*100).toFixed(1):null,secondRoundStarPct:late.length?+(late.filter(r=>r.as>=3).length/late.length*100).toFixed(1):null};console.log("AUTOSIM "+JSON.stringify(res));return "done";}
// Witness test hook (inert unless run under Witness)
// every visible text element and control, in CSS px, so phone UI checks measure the real page (not the cartoon art)
function uiList(){const out=[],vh=innerHeight,vw=innerWidth;let n=0;
  for(const el of app.querySelectorAll('button,input,h1,h2,b,span,small,div,td,th')){const r=el.getBoundingClientRect();if(!r.width||!r.height||r.bottom<0||r.top>vh||r.right<0||r.left>vw)continue;
    const btn=el.tagName==='BUTTON'||el.tagName==='INPUT',own=[...el.childNodes].some(c=>c.nodeType===3&&c.textContent.trim());
    if(!btn&&!own)continue;if(!btn&&el.closest('button'))continue;const cs=getComputedStyle(el);if(cs.visibility==='hidden'||+cs.opacity===0)continue;
    let rr=r;if(!btn){const rg=document.createRange();let L=1e9,T=1e9,Rr=-1e9,B=-1e9;for(const c of el.childNodes)if(c.nodeType===3&&c.textContent.trim()){rg.selectNodeContents(c);for(const q of rg.getClientRects()){L=Math.min(L,q.left);T=Math.min(T,q.top);Rr=Math.max(Rr,q.right);B=Math.max(B,q.bottom);}}if(Rr>L)rr={left:L,top:T,width:Rr-L,height:B-T};}
    out.push({id:'u'+(n++),kind:btn?'button':'text',rect:[rr.left,rr.top,rr.width,rr.height],text:(btn?(el.getAttribute('aria-label')||el.innerText):[...el.childNodes].filter(c=>c.nodeType===3).map(c=>c.textContent).join(' ')).trim().slice(0,60),font:parseFloat(cs.fontSize),tap:btn});}
  return out;}
if(globalThis.__witnessApi){const W=globalThis.__witnessApi;W.start({name:'Build a GOAT',fps:30,
  reset({scene}={}){['bag_hof','bag_ach','bag_daily','bag_recent','bag_gtp','bag_diff'].forEach(k=>localStorage.removeItem(k));R=Math.random;S=newPlayer();render();
    // test scenes: jump straight to a screen (witness --scene hs|offers|college|draft|nba|decision|end)
    const order=['build','hs','offers','college','draft','nba','decision','end'],at=order.indexOf(scene||'build');if(at<=0)return;
    S.name='Test Prospect';applyArch(2);S.picked=['work','dur'];startCareer();if(at===1){simHS();render();return;}
    for(let i=0;i<4;i++)simHS();if(at===2){render();return;}
    chooseSchool(0);simCol();if(at===3){render();return;}
    declare();if(at===4){render();return;}
    S.stage='nba';let g=0;while(g++<6){if(S.pend)choose(S.pend.kind==='summer'?S.pend.opts.length-1:0);else simNBA();}
    if(at===6){while(!S.pend&&S.stage==='nba'&&g++<30)simNBA();render();return;}
    if(at===5){if(S.pend)choose(0);render();return;}
    simEnd();render();},
  snapshot:()=>({ui:uiList(),stage:S.stage,name:S.name,pos:S.pos,ovr:OV(),bank:S.bank,age:S.age,hype:Math.round(S.hype),pick:S.pick??null,
    hs:S.hs.length,college:S.col.length,seasons:S.nba.length,decision:S.pend?S.pend.title:null,yourTurn:true,
    choices:W.dom.tappables().map(c=>({label:c.label,id:c.id})),screenText:W.dom.text(app).slice(0,1200)}),
  calls:{autosim:{args:'n build college fa',help:'sim n careers with a strategy; returns outcome stats',run:(n,b,col,f)=>autosim(+n||200,b||'smart',col||'smart',f||'random')},tap:{args:'id',help:'tap a choice',run:id=>{const c=W.dom.tappables({elements:true}).find(x=>x.id==id||x.label==id)||W.dom.tappables({elements:true}).find(x=>x.label.startsWith(id));if(c)c.el.scrollIntoView({block:"center"});return c?W.dom.tap(c.el):{error:'no such choice '+id};}}},
  scope:()=>({S})});}
