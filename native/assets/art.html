<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build a GOAT app art</title>
<style>
@font-face{font-family:'Bebas Neue';src:url(../fonts/bebas-neue-400.woff2) format('woff2')}
body{margin:0;background:#222}
</style>
</head>
<body>
<pre id="out" hidden></pre>
<script>
// Build a GOAT: app icon and launch splash, drawn on canvas in the game's palette (index.html :root: #0a0806 ground, #ff8a1f
// accent, gold #ffc65a). The mark is the game's own "goat" line icon (index.html ICONS.goat) over a basketball glow.
// render_art.py loads this page in headless Edge and saves each canvas as a PNG in this folder.
// ?show=1 displays the canvases instead, for eyeballing in a browser.
const GOAT=['M7.5 8h9c0 3.5-.9 6.6-2 8.7-.5 1-1.4 1.6-2.5 1.6s-2-.6-2.5-1.6C8.4 14.6 7.5 11.5 7.5 8z','M11 8C10.6 4.8 8.3 2.8 4.6 2.8c2 1.2 3.4 3 3.9 5.2',
  'M13 8c.4-3.2 2.7-5.2 6.4-5.2-2 1.2-3.4 3-3.9 5.2','M7.6 9.2c-1.6-.4-3.4 0-4.6 1 1.3.9 3.1 1.1 4.9.8','M16.4 9.2c1.6-.4 3.4 0 4.6 1-1.3.9-3.1 1.1-4.9.8','M11 18l1 3.5 1-3.5'];

function ground(ctx,S){
  const g=ctx.createLinearGradient(0,0,0,S);g.addColorStop(0,'#1d1510');g.addColorStop(1,'#0a0806');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  // hardwood boards
  ctx.save();ctx.globalAlpha=.06;ctx.strokeStyle='#ffb46a';ctx.lineWidth=S/400;for(let x=S/14;x<S;x+=S/7){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,S);ctx.stroke();}ctx.restore();
  const r=ctx.createRadialGradient(S/2,S*.46,0,S/2,S*.46,S*.62);r.addColorStop(0,'rgba(255,138,31,.38)');r.addColorStop(1,'rgba(255,138,31,0)');ctx.fillStyle=r;ctx.fillRect(0,0,S,S);
}
// a basketball centered at (cx,cy), radius R, with the goat mark on it
function emblem(ctx,cx,cy,R){
  ctx.save();
  ctx.shadowColor='rgba(255,120,20,.55)';ctx.shadowBlur=R*.35;
  const b=ctx.createRadialGradient(cx-R*.3,cy-R*.4,R*.1,cx,cy,R);b.addColorStop(0,'#ffb05a');b.addColorStop(1,'#d9580a');
  ctx.fillStyle=b;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();ctx.restore();
  // seams
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();ctx.strokeStyle='rgba(58,26,5,.55)';ctx.lineWidth=R*.045;
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(cx+s*R*1.05,cy,R*.62,R*1.05,0,0,Math.PI*2);ctx.stroke();}
  // dark disc behind the mark so it reads at small sizes
  const d=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.72);d.addColorStop(0,'rgba(20,12,6,.92)');d.addColorStop(1,'rgba(20,12,6,.75)');
  ctx.fillStyle=d;ctx.beginPath();ctx.arc(cx,cy,R*.7,0,Math.PI*2);ctx.fill();ctx.restore();
  // the goat mark (24x24 line icon)
  const k=R*1.2/24;ctx.save();ctx.translate(cx-12*k,cy-12.4*k);ctx.scale(k,k);
  const gold=ctx.createLinearGradient(0,2,0,22);gold.addColorStop(0,'#ffe08a');gold.addColorStop(1,'#ff9a2a');
  ctx.strokeStyle=gold;ctx.lineWidth=1.9;ctx.lineCap='round';ctx.lineJoin='round';
  for(const p of GOAT)ctx.stroke(new Path2D(p));
  ctx.fillStyle='#ffe08a';for(const x of[10.2,13.8]){ctx.beginPath();ctx.arc(x,11.7,1,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}
function icon(){const S=1024,c=document.createElement('canvas');c.width=c.height=S;const ctx=c.getContext('2d');
  ground(ctx,S);emblem(ctx,S/2,S/2,S*.36);return c;}
function splash(){const S=2732,c=document.createElement('canvas');c.width=c.height=S;const ctx=c.getContext('2d');
  ctx.fillStyle='#0a0806';ctx.fillRect(0,0,S,S);
  const r=ctx.createRadialGradient(S/2,S*.45,0,S/2,S*.45,S*.3);r.addColorStop(0,'rgba(255,138,31,.25)');r.addColorStop(1,'rgba(255,138,31,0)');ctx.fillStyle=r;ctx.fillRect(0,0,S,S);
  emblem(ctx,S/2,S*.45,S*.085);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.round(S*.05)}px "Bebas Neue"`;
  const w1=ctx.measureText('BUILD A ').width,w2=ctx.measureText('GOAT').width,x0=S/2-(w1+w2)/2,y=S*.57;
  ctx.textAlign='left';ctx.fillStyle='#f3e9df';ctx.fillText('BUILD A ',x0,y);ctx.fillStyle='#ff8a1f';ctx.fillText('GOAT',x0+w1,y);
  return c;}
document.fonts.load('100px "Bebas Neue"').catch(()=>{}).then(()=>{
  const out={icon:icon(),splash:splash()};
  if(/show=1/.test(location.search)){for(const k in out){out[k].style.cssText='width:512px;height:512px;margin:8px';document.body.appendChild(out[k])}return}
  document.getElementById('out').textContent=JSON.stringify(Object.fromEntries(Object.entries(out).map(([k,c])=>[k,c.toDataURL('image/png')])));
  document.title='ART READY';
});
</script>
</body>
</html>
